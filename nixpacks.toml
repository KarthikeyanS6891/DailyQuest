# Railway uses Nixpacks by default. Pin Node 20 so the build doesn't pick
# whatever the daily image happens to ship. Next 15 + React 19 work with
# 18.18+, but Drizzle Kit and some transitive deps prefer 20+ in 2026.
[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm ci --prefer-offline --no-audit --no-fund"]

[phases.build]
# Build only. Migrations CANNOT run here — Railway's private DNS
# (postgres.railway.internal) only resolves at runtime, not during the
# build phase. Migrations run from `npm run start` instead, which
# invokes scripts/migrate.mjs against the live DB.
cmds = ["npm run build"]

[start]
cmd = "npm run start"
